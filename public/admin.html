<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel • Ajuda de Custo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Login do painel -->
<form id="v-login" class="card admin-login hidden">
  <div class="login-brand" style="margin:0 0 6px"><div class="logo-rs">R$</div><h1>Ajuda de Custo</h1><span class="muted small">Comercial • 101 do Brasil · painel</span></div>
  <div class="field"><label for="a-user">Usuário</label><input id="a-user" class="input" autocomplete="username" autocapitalize="none" required></div>
  <div class="field"><label for="a-pass">Senha</label><input id="a-pass" class="input" type="password" autocomplete="current-password" required></div>
  <div id="a-erro" class="alert hidden"></div>
  <button class="btn lg block" type="submit">Entrar</button>
</form>

<!-- Painel do Maurício -->
<div id="v-painel" class="layout hidden">
  <aside class="sidebar">
    <div class="brand"><b>Ajuda de Custo</b><span>Comercial • 101 do Brasil</span></div>
    <nav class="nav" id="nav">
      <a href="#lancamentos" data-v="lancamentos">Lançamentos <span class="count hidden" id="nav-pend" title="Despesas do celular aguardando aprovação">0</span></a>
      <a href="#nova" data-v="nova">Nova prestação</a>
      <a href="#colaborador" data-v="colaborador">Resumo por colaborador</a>
      <a href="#funcao" data-v="funcao">Resumo por função</a>
      <a href="#colaboradores" data-v="colaboradores">Colaboradores</a>
    </nav>
    <div class="who">
      <b id="who-nome">Maurício</b>
      <span class="muted small">Administrador</span>
      <button class="btn xs" id="b-sair" type="button">Sair</button>
    </div>
  </aside>
  <main class="page" id="page"></main>
</div>

<div id="modal" class="modal-bg hidden"></div>

<script src="/xlsx.js"></script>
<script src="/admin.js"></script>
</body>
</html>
