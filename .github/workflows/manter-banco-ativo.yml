# Mantém ativo o banco gratuito do Supabase, que é pausado depois de 7 dias sem uso.
# A cada 2 dias, chama o sistema no Render (/health?banco=1), que faz uma leitura leve no banco.
# Se o Render estiver "dormindo", o primeiro acesso o acorda (pode levar até ~1 minuto): por isso a espera
# longa e as novas tentativas. Se falhar mesmo assim, o GitHub manda e-mail para quem cuida do repositório.
# Atenção: o GitHub desliga rotinas agendadas de repositórios sem commits há 60 dias (avisa por e-mail antes);
# para religar, aba Actions > "Manter banco ativo" > Enable workflow.
name: Manter banco ativo

on:
  schedule:
    - cron: '17 12 */2 * *' # a cada 2 dias, 12:17 UTC (9:17 em Brasília)
  workflow_dispatch: {} # botão "Run workflow" na aba Actions, para testar na hora

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chamar o sistema (leitura leve no banco)
        run: |
          curl --fail --silent --show-error --max-time 180 \
               --retry 3 --retry-delay 60 --retry-all-errors \
               "https://ajudadecustos.onrender.com/health?banco=1"
